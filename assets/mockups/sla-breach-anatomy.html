<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../theme.css">
<style>
body{margin:0;}
.fig-wrap{
  width:1500px; box-sizing:border-box; background:var(--l-surface); color:var(--l-ink);
  padding:58px 0 88px;
}
.fig-header{ display:flex; justify-content:space-between; align-items:flex-end; padding:0 120px; margin-bottom:8px; }
.fig-header .fig-title{ font-size:22px; font-weight:800; letter-spacing:-.01em; color:var(--l-ink); margin-top:5px; }
.fig-totals{ text-align:right; }
.fig-totals .lbl{ font-size:9.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--l-ink-muted); }
.fig-totals .val{ font-size:23px; font-weight:800; color:var(--l-ink); margin-top:2px; }

.chart-zone{ position:relative; width:1500px; height:200px; margin-top:34px; }

.bar-row{
  position:absolute; left:120px; top:26px; width:1260px; height:92px;
  display:flex; border-radius:10px; overflow:hidden; box-shadow:0 1px 3px rgba(0,0,0,.07);
}
.seg{ display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
.seg .seg-label{ font-size:10.3px; font-weight:700; letter-spacing:.045em; text-transform:uppercase; opacity:.94; }
.seg .seg-value{ font-size:20px; font-weight:800; margin-top:4px; letter-spacing:-.01em; }
.seg.light{ color:#ffffff; }
.seg.dark{ color:#2a2205; }

.marker-label{
  position:absolute; top:0; left:1186px; transform:translateX(-50%);
  font-size:10.5px; font-weight:800; letter-spacing:.03em; white-space:nowrap;
  background:#ffffff; color:var(--l-ink); border:1.5px solid var(--l-ink);
  border-radius:4px; padding:3px 9px;
}
.marker-line{
  position:absolute; left:1186px; top:24px; height:128px; border-left:2px dashed #4a4944; width:0;
}
.marker-line::after{
  content:""; position:absolute; left:-4px; bottom:-4px; width:8px; height:8px;
  border-radius:50%; background:#4a4944;
}

.ext-connector{
  position:absolute; left:165px; top:118px; width:0; height:22px; border-left:1.5px solid var(--l-baseline);
}
.ext-callout{
  position:absolute; left:165px; top:140px; transform:translateX(-50%);
  background:#ffffff; border:1px solid var(--l-grid); border-left:3px solid var(--c1-blue);
  border-radius:6px; padding:6px 12px 7px; text-align:center; white-space:nowrap;
  box-shadow:0 1px 2px rgba(0,0,0,.05);
}
.ext-callout .lbl{ font-size:9.6px; font-weight:700; letter-spacing:.03em; text-transform:uppercase; color:var(--l-ink-2); }
.ext-callout .val{ font-size:14px; font-weight:800; color:var(--l-ink); margin-top:1px; }

.fig-caption{ padding:6px 120px 0; margin-top:22px; }
.fig-caption p{
  font-size:16px; line-height:1.5; font-weight:600; color:var(--l-ink); margin:0;
  border-left:3px solid var(--c8-red); padding-left:14px;
}
.fig-caption b{ font-weight:800; }
.fig-caption .n12{ color:var(--c2-orange-d); }
</style>
</head>
<body>
<div class="fig-wrap">

  <div class="fig-header">
    <div>
      <div class="kicker">Figure — Case Timeline</div>
      <div class="fig-title">Anatomy of a Breach <span class="illustrative-tag" style="margin-left:8px;">Illustrative</span></div>
    </div>
    <div class="fig-totals">
      <div class="lbl">Total case time</div>
      <div class="val">70 min</div>
    </div>
  </div>

  <div class="chart-zone">

    <div class="marker-label">SLA target: 60 min</div>
    <div class="marker-line"></div>

    <div class="bar-row">
      <div class="seg" style="width:90px;background:var(--c1-blue);"></div>
      <div class="seg light" style="width:216px;background:var(--c2-orange);">
        <div class="seg-label">Triage</div>
        <div class="seg-value">12 min</div>
      </div>
      <div class="seg light" style="width:324px;background:var(--c3-aqua);">
        <div class="seg-label">Telemetry delay</div>
        <div class="seg-value">18 min</div>
      </div>
      <div class="seg dark" style="width:450px;background:var(--c4-yellow);">
        <div class="seg-label">Customer dependency</div>
        <div class="seg-value">25 min</div>
      </div>
      <div class="seg dark" style="width:180px;background:var(--c5-magenta);">
        <div class="seg-label">Escalation delay</div>
        <div class="seg-value">10 min</div>
      </div>
    </div>

    <div class="ext-connector"></div>
    <div class="ext-callout">
      <div class="lbl">Queue wait</div>
      <div class="val">5 min</div>
    </div>

  </div>

  <div class="fig-caption">
    <p>&ldquo;Analyst was slow&rdquo; explains <b class="n12">12</b> of the 70 minutes. It does not explain the other <b>58</b>.</p>
  </div>

</div>
</body></html>
